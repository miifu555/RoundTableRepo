<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>RoundTable</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101014">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101014;
      color: #e8e6df;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
      /* スマホでの引っ張りスクロール・ダブルタップ拡大を止める */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-container {
      position: fixed;
      inset: 0;
    }
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #101014;
      /* iOS Safari のアドレスバー分を避ける */
      padding-bottom: env(safe-area-inset-bottom);
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
      background: #101014;
    }
    #unity-loading .title {
      font-size: 20px;
      letter-spacing: 0.08em;
    }
    #unity-loading .bar {
      width: min(280px, 70vw);
      height: 6px;
      border-radius: 3px;
      background: #2a2a31;
      overflow: hidden;
    }
    #unity-loading .fill {
      width: 0%;
      height: 100%;
      background: #c8a24a;
      transition: width 0.15s linear;
    }
    #unity-loading .note {
      font-size: 12px;
      color: #8b897f;
    }
    /* 縦持ちのときだけ「横にして」を出す。UI が 1920x1080 前提なので縦だと極端に小さくなる。 */
    #unity-rotate {
      display: none;
      font-size: 16px;
      line-height: 1.8;
    }
    #unity-rotate .icon {
      font-size: 44px;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #unity-rotate { display: flex; }
    }
    #unity-error {
      display: none;
      font-size: 13px;
      line-height: 1.8;
      color: #e0776b;
      word-break: break-all;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="unity-loading" class="overlay">
    <div class="title">RoundTable</div>
    <div class="bar"><div class="fill" id="unity-progress"></div></div>
    <div class="note">読み込み中… 初回は少し時間がかかります</div>
  </div>

  <div id="unity-rotate" class="overlay">
    <div class="icon">📱↻</div>
    <div>画面を横向きにしてください</div>
  </div>

  <div id="unity-error" class="overlay"></div>

  <script src="Build/WebGL.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progress = document.querySelector("#unity-progress");
    var errorBox = document.querySelector("#unity-error");

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    var config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "RoundTable",
      productVersion: "1.0",
      // スマホは解像度を上げすぎると重いので等倍で描く
      devicePixelRatio: isMobile ? 1 : window.devicePixelRatio,
    };

    function showError(message) {
      loading.hidden = true;
      errorBox.style.display = "flex";
      errorBox.textContent = message;
    }

    createUnityInstance(canvas, config, function (p) {
      progress.style.width = (100 * p) + "%";
    }).then(function () {
      loading.hidden = true;
      canvas.focus();
    }).catch(function (err) {
      showError("起動できませんでした: " + err);
    });

    // 画面回転・アドレスバーの出入りで高さが変わるので、その都度貼り直す
    window.addEventListener("resize", function () {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    });
  </script>
</body>
</html>
