# スマホのブラウザで遊べるように、WebGL でビルドして GitHub Pages に公開する。
# Unity エディタを開かなくても、main に push すればここで勝手にビルドされる。
#
# 事前に必要な設定は Assets/RoundTable/Docs/Build.md を参照。
#   1. Settings > Secrets に UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD を登録
#   2. Settings > Pages の Source を「GitHub Actions」にする
name: WebGL ビルド → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/webgl-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない（Pages への配信が競合するため）。走行中のものは終わらせてから。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.8f1
  BUILD_DIR: build/WebGL

jobs:
  build:
    name: WebGL ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: ライセンス設定の確認
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Secret UNITY_LICENSE が未設定です。Assets/RoundTable/Docs/Build.md の手順で登録してください。"
            exit 1
          fi

      - name: 空き容量を確保
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - uses: actions/checkout@v4
        with:
          lfs: false

      # Library の再生成は非常に遅いので必ずキャッシュする
      - name: Library をキャッシュ
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Unity で WebGL をビルド
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: RoundTable.EditorTools.CIBuild.WebGL
          customParameters: -buildOutput ${{ env.BUILD_DIR }}
          allowDirtyBuild: true

      - name: 出力を確認
        run: |
          ls -la "${BUILD_DIR}"
          test -f "${BUILD_DIR}/index.html" || {
            echo "::error::index.html が出力されていません。ビルドログを確認してください。"
            exit 1
          }
          du -sh "${BUILD_DIR}"

      - name: Pages 用に固める
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    name: GitHub Pages へ公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
